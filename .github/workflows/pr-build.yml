name: Build pull request

on:
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:

  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Check release tooling
      run: python -m unittest discover -s scripts/tests -v

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        $dalamud = Join-Path $env:RUNNER_TEMP 'dalamud'
        Expand-Archive -Force latest.zip $dalamud
        "DALAMUD_HOME=$dalamud" >> $env:GITHUB_ENV

    - name: Build with dotnet
      run: dotnet build XivSyncManager.slnx --configuration Release -p:RestoreLockedMode=true

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XivSyncManager
        path: src/bin/x64/Release/XivSyncManager/latest.zip
        if-no-files-found: error
        retention-days: 1
